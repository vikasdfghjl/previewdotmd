# Cloudflare Workers static assets deployment
# Deploys the static export output from Next.js
# See: https://developers.cloudflare.com/workers/static-assets/

name = "previewdotmd"
compatibility_date = "2025-06-01"

# Static assets directory (Next.js static export output)
[assets]
directory = "out"

# The service worker handles offline and PWA features
# Static assets have immutable cache headers via _headers file
